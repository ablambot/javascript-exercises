<!DOCTYPE html>
<html lang="en">
<head>
  <title>Variables</title>
</head>
<body>

  <script>
    const cost = 5 + 2 * 3 + 9;

    const tax = (5 + 2 * 3 + 9) * 0.1;

    const totalCost = cost + tax;

    console.log(`Cost of food: $${cost}`);
    console.log(`Tax (10%): $${tax}`);
    console.log(`Total cost: $${totalCost}`);
  </script>
</body>
</html>
